<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Tiempo de Lectura y Métricas</title>
    <!-- Subimos 3 niveles para llegar a css/base.css -->
    <link rel="stylesheet" href="../../css/base.css" />
  </head>
  <body>
    <main class="container">
      <h1>Calculadora de Tiempo de Lectura</h1>
      <p class="subtitle">
        Pega un artículo para conocer su extensión y el tiempo estimado de
        lectura.
      </p>

      <div class="form-group">
        <label for="texto-input">Texto a analizar:</label>
        <textarea
          id="texto-input"
          rows="10"
          placeholder="Pega aquí el texto del artículo..."
        ></textarea>
      </div>

      <div class="form-group">
        <label for="velocidad-select">Velocidad de lectura:</label>
        <select id="velocidad-select">
          <option value="180">Lenta (180 palabras/min)</option>
          <option value="230" selected>Media (230 palabras/min)</option>
          <option value="280">Rápida (280 palabras/min)</option>
        </select>
      </div>

      <section class="results-grid" aria-label="Resultados del análisis">
        <div class="card">
          <h3>Palabras</h3>
          <p id="stat-palabras">0</p>
        </div>
        <div class="card">
          <h3>Caracteres (con espacios)</h3>
          <p id="stat-caracteres-con">0</p>
        </div>
        <div class="card">
          <h3>Caracteres (sin espacios)</h3>
          <p id="stat-caracteres-sin">0</p>
        </div>
        <div class="card">
          <h3>Frases</h3>
          <p id="stat-frases">0</p>
        </div>
        <div class="card">
          <h3>Párrafos</h3>
          <p id="stat-parrafos">0</p>
        </div>
        <div class="card">
          <h3>Tiempo estimado</h3>
          <p id="stat-tiempo">0 s</p>
        </div>
      </section>

      <button type="button" id="btn-copiar" class="btn-primary">
        Copiar resumen
      </button>
      <p id="aviso-copiado" class="aviso-exito hidden" role="status">
        ¡Resumen copiado al portapapeles!
      </p>
    </main>

    <script src="./js/script.js"></script>
  </body>
</html>
